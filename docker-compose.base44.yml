services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    command:
      - sh
      - -ec
      - |
        # Run nginx as root so it can read the bind-mounted source regardless of host dir perms
        sed -i 's/^user .*/user root;/' /etc/nginx/nginx.conf
        # Serve Index.html (capital I) as the directory index
        printf 'server {\n  listen 80;\n  server_name _;\n  root /usr/share/nginx/html;\n  index Index.html;\n  location / { try_files $$uri $$uri/ =404; }\n}\n' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
